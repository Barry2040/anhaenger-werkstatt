.body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}

.lab{font-size:12.5px;color:var(--muted);min-width:96px}

.arrow{color:var(--muted);font-size:12px}

.note{font-size:12px;color:var(--muted);margin:0}
.warn{font-size:12px;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:7px 9px;margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}

.kv dd{margin:0;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}

@media (max-width:820px){
  .work{display:block;overflow-y:auto}
  .app{height:auto;min-height:100%}

  .panel{border-left:0;overflow:visible}
  .f{grid-template-columns:84px minmax(0,1fr) 78px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  const v2 = ct => ct.map(p => new THREE.Vector2(p.X / S, p.Y / S));
  const walk = node => {
    for (const ch of node.Childs()) {

      const sh = new THREE.Shape(v2(ch.Contour()));
      for (const h of ch.Childs()) { sh.holes.push(new THREE.Path(v2(h.Contour()))); walk(h); }

}

  const rim = `<label class="check"><input type="checkbox" id="rimOn" data-p="rim.on" data-rr="1" ${state.rim.on ? 'checked' : ''}> Erhabener Rand</label>` +
    (state.rim.on ? F('Randbreite', 'rim.w', 0.6, 5, 0.1) + `<div class="row"><span class="lab">Randfarbe</span>${chips('rim.slot', state.rim.slot)}</div>` : '') +
    F('Relief-Höhe', 'layer.raise', 0.4, 4, 0.1) + F('Einlege-Tiefe', 'layer.depth', 0.2, 2, 0.1) +
    `<p class="note">„Erhaben“ steht um die Relief-Höhe über der Oberfläche. „Eingelegt“ liegt bündig und ist so tief wie die Einlege-Tiefe – am saubersten mit AMS/MMU. Tipp: Vielfache der Schichthöhe (0,2 mm).</p>`;

  const els = state.elements.map((e, i) => {
    const cols = e.type === 'svg' ? [...new Set(Object.values(e.map).filter(v => v >= 0))] : [e.slot];
    return `<div class="el ${e.id === state.selected ? 'on' : ''}" data-act="sel" data-id="${e.id}"><span class="ty">${e.type === 'svg' ? 'SVG' : 'Text'}</span><span class="nm">${esc(e.type === 'text' ? (e.text || '…').replace(/\n/g, ' / ') : e.name)}</span><span class="dots">${cols.map(c => `<i style="--c:${state.slots[c]?.color || '#888'}"></i>`).join('')}</span>
    <button class="ico" type="button" data-act="up" data-id="${e.id}" title="Nach vorne (oben)" aria-label="Nach vorne">↑</button><button class="ico" type="button" data-act="down" data-id="${e.id}" title="Nach hinten" aria-label="Nach hinten">↓</button><button class="ico" type="button" data-act="dup" data-id="${e.id}" title="Duplizieren" aria-label="Duplizieren">⧉</button><button class="ico" type="button" data-act="del" data-id="${e.id}" title="Löschen" aria-label="Löschen">✕</button></div>`;
  }).reverse().join('');
  let elsHtml = `<div class="row"><button class="btn" type="button" data-act="addSvg">+ SVG-Logo</button><button class="btn" type="button" data-act="addText">+ Text</button></div>
  <div class="els">${els || '<div class="empty">Noch keine Elemente. Füge ein SVG-Logo oder einen Text hinzu – oder zieh eine SVG-Datei in die Ansicht.</div>'}</div>`;
  const e = sel();
  if (e) {
    let ed = `<h4>${e.type === 'svg' ? 'Logo bearbeiten' : 'Text bearbeiten'}</h4>`;
    if (e.type === 'text') {
      ed += `<textarea id="etext" data-p="el.text" data-rrl="1" rows="2" aria-label="Text">${esc(e.text)}</textarea>
      <div class="row"><label class="lab" for="efont">Schrift</label><select id="efont" data-p="el.font" data-rr="1">${FONTS.map(([f]) => `<option value="${esc(f)}" ${e.font === f ? 'selected' : ''} style="font-family:'${esc(f)}'">${esc(f)}</option>`).join('')}</select><button class="btn small" type="button" data-act="addFont" title="Eigene Schriftdatei laden">Datei…</button></div>
      ${F('Schriftgröße', 'el.size', 3, 40, 0.5)}${F('Abstand', 'el.spacing', -0.1, 0.5, 0.01, 'em')}
      <div class="row"><span class="lab">Farbe</span>${chips('el.slot', e.slot)}</div>`;
    } else {
      ed += `<div class="row"><button class="btn small" type="button" data-act="fit">⤢ In Form einpassen</button><button class="btn small" type="button" data-act="recolor">Originalfarben zuordnen</button></div>` +
        F('Größe', 'el.size', 4, 120, 0.5) + `<div class="map"><span class="lab">Farben im Logo → Filament</span>${e.regions.map(r => `<div class="maprow"><span class="orig" style="--c:${r.color}" title="${r.color}"></span><span class="arrow">→</span>${chips(r.color, e.map[r.color] ?? -1, true, 'data-map')}</div>`).join('')}</div>`;
    }
    ed += seg('el.mode', [['inlay', 'Eingelegt'], ['raised', 'Erhaben'], ['engraved', 'Graviert']], 'Art');
    ed += F('Position X', 'el.x', -60, 60, 0.5) + F('Position Y', 'el.y', -60, 60, 0.5) + F('Drehung', 'el.rot', -180, 180, 1, '°') +
      F('Verstärkung', 'el.grow', -0.3, 1.5, 0.05) +
      `<label class="check"><input type="checkbox" id="emir" data-p="el.mirror" ${e.mirror ? 'checked' : ''}> Spiegeln</label>
      <label class="check"><input type="checkbox" id="eout" data-p="el.outline.on" data-rr="1" ${e.outline.on ? 'checked' : ''}> Kontur in eigener Farbe</label>` +
      (e.outline.on ? F('Konturbreite', 'el.outline.w', 0.3, 5, 0.1) + `<div class="row"><span class="lab">Konturfarbe</span>${chips('el.outline.slot', e.outline.slot)}</div>` : '');
    elsHtml += `<div class="edit">${ed}</div>`;
  }
  elsHtml += `<p class="note">SVG-Texte vorher in Pfade umwandeln (z. B. Inkscape: Pfad → Objekt in Pfad). Verläufe werden zu einer Farbe. Elemente weiter oben in der Liste liegen vorne.</p>`;

  const used = usedSlots();
  const slots = `<div class="slots">${state.slots.map((s, i) => `<div class="slot"><span class="n">${i + 1}</span><input type="color" id="sc${i}" value="${s.color}" data-slot="${i}" data-k="color" aria-label="Farbe Slot ${i + 1}"><input type="text" id="sn${i}" value="${esc(s.name)}" data-slot="${i}" data-k="name" aria-label="Name Slot ${i + 1}"><span class="use">${used.has(i) ? 'genutzt' : ''}</span>${state.slots.length > 1 ? `<button class="ico" type="button" data-act="delSlot" data-i="${i}" title="Slot entfernen" aria-label="Slot ${i + 1} entfernen">✕</button>` : ''}</div>`).join('')}</div>
  ${state.slots.length < 16 ? `<div class="row"><button class="btn small" type="button" data-act="addSlot">+ Farbe</button></div>` : ''}
  <p class="note">Die Nummer ist der Filament-Slot im Slicer (z. B. AMS-Platz). So landen die Teile direkt auf der richtigen Spule.</p>`;

  const exp = `<div class="row"><label class="lab" for="pname">Dateiname</label><input type="text" id="pname" data-p="name" value="${esc(state.name)}" style="flex:1"></div>
  <div id="info"></div>
  <button class="btn primary" type="button" data-act="export" style="justify-content:center">⤓ ZIP mit 3MF + STL pro Farbe</button>
  <p class="note">Die 3MF öffnet in Bambu Studio, OrcaSlicer und PrusaSlicer als ein Objekt mit mehreren Teilen, jedes schon seinem Filament-Slot zugeordnet. Zusätzlich liegt jede Farbe als einzelne STL bei.</p>`;

  panel.innerHTML = sec('form', 'Grundform', '', form) + sec('hole', 'Öse', '', hole) + sec('layer', 'Rand & Ebenen', '', rim) +
    sec('els', 'Logos & Texte', state.elements.length ? state.elements.length + '' : '', elsHtml) + sec('slots', 'Filamentfarben', state.slots.length + ' Slots', slots) + sec('export', 'Export', '', exp);
  panel.scrollTop = st;
  renderInfo();
}
function renderInfo() {
  const box = document.getElementById('info'); if (!box || !model) return;
  const used = [...usedSlots()].sort((a, b) => a - b);
  const top = model.T + (model.raisedAny ? model.hR : 0);
  let h = `<dl class="kv"><dt>Maße</dt><dd>${model.ob ? `${model.ob.w.toFixed(1)} × ${model.ob.h.toFixed(1)} × ${top.toFixed(1)} mm` : '–'}</dd>
  <dt>Farben</dt><dd>${used.map(i => `<span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${state.slots[i].color};border:1px solid var(--line);vertical-align:-1px"></span> ${i + 1}`).join('  ') || '–'}</dd>
  ${model.cutAny ? `<dt>Farbebene</dt><dd>ab Z ${(model.T - model.d).toFixed(2)} mm (eingelegt)</dd>` : ''}
  ${model.raisedAny ? `<dt>Relief</dt><dd>ab Z ${model.T.toFixed(2)} mm (erhaben)</dd>` : ''}</dl>`;
  if (used.length > 4) h += `<p class="warn">${used.length} Farben genutzt. Ein einzelnes AMS hat 4 Plätze.</p>`;
  if (!model.cutAny && model.raisedAny) {
    const rs = new Set(model.pieces.filter(p => p.layer === 'raised').map(p => p.slot));
    if (rs.size === 1) h += `<p class="note">Geht auch ohne AMS: Filamentwechsel (Pause) bei Z = ${model.T.toFixed(2)} mm einfügen.</p>`;
  }
  model.warn.forEach(w => { h += `<p class="warn">${esc(w)}</p>`; });
  if (model.loading) h += `<p class="note">Schrift wird geladen …</p>`;
  box.innerHTML = h;
}
function syncFields() {
  panel.querySelectorAll('[data-p^="el.x"],[data-p^="el.y"]').forEach(i => { const v = getP(i.dataset.p); if (document.activeElement !== i) i.value = v; });
}

panel.addEventListener('toggle', ev => { const d = ev.target; if (d.dataset?.sec) d.open ? openSecs.add(d.dataset.sec) : openSecs.delete(d.dataset.sec); }, true);
panel.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.slot !== undefined) {
    state.slots[+t.dataset.slot][t.dataset.k] = t.value; schedule(); return;
  }
  const p = t.dataset.p; if (!p) return;
  let v;
  if (t.type === 'checkbox') v = t.checked;
  else if (t.type === 'range' || t.type === 'number') { v = parseFloat(t.value); if (!Number.isFinite(v)) return; }
  else v = t.value;
  setP(p, v);
  panel.querySelectorAll(`[data-p="${p}"]`).forEach(o => { if (o !== t && o.type !== 'checkbox') o.value = v; });
  if (t.dataset.rr) { render(); }
  if (t.dataset.rrl && p === 'el.text') { const n = panel.querySelector('.el.on .nm'); if (n) n.textContent = (v || '…').replace(/\n/g, ' / '); }
  schedule();
});
panel.addEventListener('change', ev => { if (ev.target.dataset.slot !== undefined) { render(); schedule(); } });
panel.addEventListener('click', ev => {
  const c = ev.target.closest('[data-chip],[data-map],[data-seg]');
  if (c) {
    if (c.dataset.chip) setP(c.dataset.chip, +c.dataset.v);
    else if (c.dataset.map) { const e = sel(); if (e) e.map[c.dataset.map] = +c.dataset.v; }
    else setP(c.dataset.seg, c.dataset.v);
    render(); schedule(); return;
  }
});
document.addEventListener('click', ev => {
  const a = ev.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, id = a.dataset.id, i = state.elements.findIndex(e => e.id === id);
  switch (act) {
    case 'sel': if (ev.target.closest('.ico')) return; state.selected = id; render(); drawSelection(); return;
    case 'up': if (i < state.elements.length - 1) { const [x] = state.elements.splice(i, 1); state.elements.splice(i + 1, 0, x); } break;
    case 'down': if (i > 0) { const [x] = state.elements.splice(i, 1); state.elements.splice(i - 1, 0, x); } break;
    case 'dup': { const c = JSON.parse(JSON.stringify(state.elements[i])); c.id = nid(); c.x += 3; c.y -= 3; state.elements.splice(i + 1, 0, c); state.selected = c.id; break; }
    case 'del': state.elements.splice(i, 1); if (state.selected === id) state.selected = null; break;
    case 'addSvg': document.getElementById('fileSvg').click(); return;
    case 'addText': addTextElement(); return;
    case 'fit': { const e = sel(); if (e?.type === 'svg') fitSvg(e); break; }
    case 'recolor': { const e = sel(); if (e?.type === 'svg') { const bg = Object.keys(e.map).find(c => e.map[c] === -1); e.map = autoMap(e.regions.map(r => r.color), bg, e.edge); } break; }
    case 'addFont': document.getElementById('fileFont').click(); return;
    case 'addSlot': state.slots.push({ color: '#c0392b', name: 'Farbe ' + (state.slots.length + 1) }); break;
    case 'delSlot': {
      const k = +a.dataset.i; state.slots.splice(k, 1);
      const fix = v => v === k ? 0 : v > k ? v - 1 : v;
      state.base.slot = fix(state.base.slot); state.rim.slot = fix(state.rim.slot);
      state.elements.forEach(e => { if (e.type === 'text') e.slot = fix(e.slot); else for (const c in e.map) if (e.map[c] >= 0) e.map[c] = fix(e.map[c]); e.outline.slot = fix(e.outline.slot); });
      break;
    }
    case 'export': doExport(); return;
    case 'saveProj': saveFile(safeName() + '.json', strToU8(JSON.stringify(state))); return;
    case 'loadProj': document.getElementById('fileProj').click(); return;
    case 'new': { const slots = state.slots; state = defaultState(); state.slots = slots; break; }
    case 'view3d': setView('3d'); return;
    case 'viewTop': setView('top'); return;
    case 'viewBottom': setView('bottom'); return;
    default: return;
  }
  render(); schedule();
});

/* Dateien */
async function readSvgFiles(files) {
  for (const f of files) { if (!/svg/i.test(f.type) && !/\.svg$/i.test(f.name)) { toast(`${f.name} ist keine SVG-Datei.`); continue; } addSvgElement(await f.text(), f.name); }
}
document.getElementById('fileSvg').addEventListener('change', ev => { readSvgFiles([...ev.target.files]); ev.target.value = ''; });
document.getElementById('fileProj').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
  try { loadState(JSON.parse(await f.text())); render(); schedule(); setView('3d'); toast('Projekt geladen.'); } catch { toast('Diese Datei ist kein gültiges Projekt.'); }
});
document.getElementById('fileFont').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
  try {
    const fam = 'Eigene ' + f.name.replace(/\.\w+$/, '').slice(0, 30);
    const face = new FontFace(fam, await f.arrayBuffer()); await face.load(); document.fonts.add(face);
    if (!FONTS.find(x => x[0] === fam)) FONTS.push([fam, 400]);
    const e = sel(); if (e && e.type === 'text') e.font = fam;
    render(); schedule(); toast(`Schrift „${fam}“ geladen (nur für diese Sitzung).`);
  } catch { toast('Die Schriftdatei konnte nicht geladen werden.'); }
});
let dragDepth = 0; const drop = document.getElementById('drop');
stage.addEventListener('dragenter', ev => { ev.preventDefault(); dragDepth++; drop.hidden = false; });
stage.addEventListener('dragover', ev => ev.preventDefault());
stage.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; drop.hidden = true; } });
stage.addEventListener('drop', ev => { ev.preventDefault(); dragDepth = 0; drop.hidden = true; readSvgFiles([...ev.dataTransfer.files]); });
document.addEventListener('paste', ev => {
  if (ev.target.closest && ev.target.closest('input,textarea')) return;
  const t = ev.clipboardData?.getData('text') || '';
  if (/<svg[\s>]/i.test(t)) { addSvgElement(t, 'Eingefügtes Logo'); toast('SVG aus der Zwischenablage eingefügt.'); }
});

let toastT; function toast(msg) {
  let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200);
}

/* ================= Start ================= */
let restored = false;
try { const s = localStorage.getItem(LS); if (s) { loadState(JSON.parse(s)); restored = true; } } catch {}
if (!restored) {
  const r = importSvg(SAMPLE_SVG, 'Berg');
  if (r) state.elements.push({ id: nid(), type: 'svg', name: 'Beispiel-Logo Berg', regions: r.regions, aw: r.aw, ah: r.ah, edge: r.edge, map: autoMap(r.colors, r.bg, r.edge), x: -17, y: 0, size: 23, rot: 0, mirror: false, mode: 'inlay', grow: 0, outline: { on: false, w: 1, slot: 1 } });
  state.elements.push({ id: nid(), type: 'text', name: 'Text', text: 'ALPEN', font: 'Lilita One', spacing: 0.02, x: 12, y: -0.5, size: 12, rot: 0, mirror: false, mode: 'inlay', grow: 0, slot: 1, outline: { on: false, w: 0.8, slot: 0 } });
  state.selected = state.elements[1]?.id || null;
}
render(); buildPreview(); setView('3d');
</script>

</body>
</html>
